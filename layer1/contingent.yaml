contingent_facts:
- id: contingent.inverse_square_law
  relation: 'Gauss law in D spatial dimensions: flux ∝ r^(D−1) → F ∝ 1/r^(D−1). D=3
    → F ∝ 1/r². This applies to both gravity and electrostatics.

    '
  quantities:
  - qty.force
  - qty.length
  scope:
  - classical_limit
  provenance: Ehrenfest (1917); Gauss law in D dimensions
  hardness: contingent.derived
  layer: contingent
  derived_from:
  - kernel.spacetime_dimensionality
  - rule.dimensional_consistency
  logical_type: EC
- id: contingent.so3_rotation_group
  relation: 'In D spatial dimensions, rotation group SO(D) has D(D−1)/2 generators.
    D=3 → SO(3) with 3 generators: L_x, L_y, L_z. The Lie algebra: [Lᵢ, Lⱼ] = iεᵢⱼₖLₖ.

    '
  quantities:
  - qty.angular_momentum
  scope: []
  provenance: SO(D) group theory; Goldstein §4.10
  hardness: contingent.derived
  layer: contingent
  derived_from:
  - kernel.spacetime_dimensionality
  logical_type: EC
- id: contingent.huygens_principle
  relation: 'Wave equation Green function has sharp delta-function wavefront only
    for odd D ≥ 3. D=3 (odd) → clean signal propagation. Even D → signal smears, echoes
    follow main pulse.

    '
  quantities:
  - qty.time
  - qty.length
  scope:
  - vacuum
  provenance: Hadamard (1923); Courant & Hilbert §VI.12
  hardness: contingent.derived
  layer: contingent
  derived_from:
  - kernel.spacetime_dimensionality
  logical_type: EC
- id: contingent.stable_kepler_orbits
  relation: 'Effective potential: V_eff = −k/r^(D−2) + L²/(2mr²). For D>3, centrifugal
    barrier at small r is too weak → no stable minimum. D=3 is the only dimension
    allowing stable closed orbits.

    '
  quantities:
  - qty.energy
  - qty.angular_momentum
  - qty.length
  scope:
  - classical_limit
  - conservative_force
  provenance: Ehrenfest (1917); Tangherlini (1963)
  hardness: contingent.derived
  layer: contingent
  derived_from:
  - kernel.spacetime_dimensionality
  logical_type: EC
- id: contingent.volume_dimension
  relation: 'In D spatial dimensions, volume has dimension [L^D]. D=3 fixes volume
    as [L³] and supports pressure-volume dimensional checks.

    '
  quantities:
  - qty.volume
  - qty.pressure
  - qty.length
  scope:
  - macroscopic_limit
  provenance: BIPM SI Brochure §2.3.3; dimensional analysis in D spatial dimensions
  hardness: contingent.derived
  layer: contingent
  derived_from:
  - kernel.spacetime_dimensionality
  - rule.dimensional_consistency
  logical_type: EC
- id: contingent.minkowski_signature
  relation: 'In 3+1 spacetime, Lorentz-invariant intervals use one time-like and three
    space-like signs: ds² = c²dt² − dx² − dy² − dz².

    '
  quantities:
  - qty.spacetime_interval
  - cst.speed_of_light
  - qty.time
  - qty.length
  scope:
  - relativistic_regime
  provenance: Minkowski (1908); Einstein (1905)
  hardness: contingent.derived
  layer: contingent
  derived_from:
  - kernel.spacetime_dimensionality
  - kernel.path_integral_structure
  logical_type: EC
- id: contingent.gw_polarizations
  relation: 'In four spacetime dimensions, linearized general covariance leaves two
    transverse-traceless gravitational wave polarizations.

    '
  quantities:
  - qty.metric_tensor
  scope:
  - relativistic_regime
  provenance: Misner, Thorne & Wheeler §35.4; Weinberg GR §10.2
  hardness: contingent.derived
  layer: contingent
  derived_from:
  - kernel.spacetime_dimensionality
  - kernel.metric_dynamics
  logical_type: EC
- id: contingent.sm_gauge_group
  relation: gauge_group = SU(3)_C × SU(2)_L × U(1)_Y
  quantities:
  - qty.color_charge
  - qty.weak_isospin
  - qty.weak_hypercharge
  scope: []
  provenance: Glashow (1961); Weinberg (1967); Salam (1968); Gross, Wilczek, Politzer
    (1973)
  hardness: contingent
  layer: contingent
  logical_type: EC
- id: contingent.sm_fermion_content
  relation: '3 generations of chiral fermions: Q_L(3,2,1/6), u_R(3,1,2/3), d_R(3,1,−1/3),
    L_L(1,2,−1/2), e_R(1,1,−1). Antiparticles form conjugate representations.

    '
  quantities:
  - qty.generation
  - qty.color_charge
  - qty.weak_isospin
  - qty.weak_hypercharge
  scope: []
  provenance: Particle Data Group; experimental fact — not derivable from gauge group
    alone
  hardness: contingent
  layer: contingent
  logical_type: EC
- id: contingent.sm_higgs_sector
  relation: 'One complex scalar SU(2)_L doublet φ with Y=1. Spontaneous symmetry breaking:
    SU(2)_L × U(1)_Y → U(1)_EM at v ≈ 246 GeV. Three Goldstone bosons → longitudinal
    W^±, Z modes; one physical Higgs boson h remains.

    '
  quantities:
  - qty.higgs_vev
  - qty.weak_mixing_angle
  - qty.electric_charge
  scope: []
  provenance: Higgs (1964); Englert & Brout (1964); Guralnik, Hagen & Kibble (1964);
    ATLAS/CMS (2012)
  hardness: contingent
  layer: contingent
  logical_type: EC
- id: contingent.sm_free_parameters
  relation: 'The Standard Model has 19 free parameters (26 with neutrino masses):
    3 gauge couplings (g₁, g₂, g₃), Higgs vev v and quartic λ, 6 quark masses, 3 charged
    lepton masses, 4 CKM parameters, θ_QCD, (+ 3 neutrino masses, 4 PMNS parameters,
    2 Majorana phases). None are derivable from kernel principles alone.

    '
  quantities:
  - qty.higgs_vev
  scope: []
  provenance: Particle Data Group 2024; experimental measurements
  hardness: contingent
  layer: contingent
  logical_type: EC
