# ─────────────────────────────────────────────────────────────────
# Physics Foundations — Kernel Frameworks (Round 15: T+EP)
# ─────────────────────────────────────────────────────────────────
#
# 内核层 (kernel)：物理理论推导图的根节点。
# Round 15 重构：从 13 kernel → 2 物理基础 (T+EP) + 认知偶然。
#
# 分层：
#   kernel     — 不可推导的物理公理，推导图的根
#   structural — 约束定律形式的元规则
#   contingent — 本宇宙的认知偶然事实 [EC]
#
# 标注体系 (rules.md 定义):
#   [M] 数学必然  [E] 实验事实  [P] 物理假设  [L] 逻辑推论
#   [E1] 严格涌现  [E2] 部分涌现  [E3] 纲领性涌现
#   [EC] 认知偶然  [OC] 本体论偶然
# ─────────────────────────────────────────────────────────────────

kernels:

  # ═══════════════════════════════════════════════════════════════
  # T: 路径积分结构
  # ═══════════════════════════════════════════════════════════════
  - id: kernel.path_integral_structure
    relation: >
      The complete predictive content of a physical theory is given by
      Z[J] = ∫ D[configurations] e^{i·Phase[config, J]}.
      This single structure unifies:
      - Dynamics: δS = 0 as stationary phase in the ħ → 0 limit [M]
      - Quantum structure: Hilbert space + unitary evolution + Born rule
        as boundary projections [L, E1]
      - Thermodynamics: partition function via Wick rotation t → -iτ [L, E1]
      The classical, quantum, and statistical domains are three projections
      of the same structure — not independent postulates.
    quantities:
      - qty.action
      - qty.state_vector
      - qty.probability_density
      - qty.entropy
    scope: []
    provenance: >
      Feynman (1948) — path integral formulation of QM;
      Hardy (2001) — QM as unique probability theory with continuous reversible
      transformations; Gleason (1957) — Born rule as unique consistent probability
      on Hilbert space; Jaynes (1957) — statistical mechanics as maximum entropy
      inference
    hardness: kernel
    layer: kernel
    logical_type: P

  # ═══════════════════════════════════════════════════════════════
  # EP: 度规动力学性质
  # ═══════════════════════════════════════════════════════════════
  - id: kernel.metric_dynamics
    relation: >
      The spacetime metric g_μν is itself a dynamical field (not a fixed
      background). The equivalence principle holds at three levels:
      WEP (m_i = m_g, tested to 10^{-15}), EEP (local position/velocity
      invariance), SEP (all laws including gravity take same form in local
      freely-falling frames).
      Status: possibly independent of T, possibly derivable from T + existence
      of massless spin-2 (Weinberg 1964). Marked as [P] — ultimate status
      deferred pending quantum gravity.
    quantities:
      - qty.metric_tensor
      - qty.mass
    scope: []
    provenance: >
      Einstein (1907, 1915); Lovelock (1971) — uniqueness of 2nd-order metric
      Lagrangian in 4D; Weinberg (1964) — soft graviton argument
    hardness: kernel
    layer: kernel
    logical_type: P
    independence_status: open

  # ═══════════════════════════════════════════════════════════════
  # EC1: 时空维度 (认知偶然)
  # ═══════════════════════════════════════════════════════════════
  - id: kernel.spacetime_dimensionality
    relation: >
      Observed spacetime has D = 3+1 (three extended spatial dimensions,
      one temporal dimension). This is an epistemic contingent fact [EC] —
      not derivable from T or EP, but possibly derivable from deeper theory
      (causal set theory suggests D=4 maximizes information capacity).
    quantities:
      - qty.time
      - qty.length
    scope: []
    provenance: "Observed macroscopic spacetime; Ehrenfest (1917)"
    hardness: kernel
    layer: kernel
    logical_type: EC

# ═════════════════════════════════════════════════════════════════
# 结构性元规则
# ═════════════════════════════════════════════════════════════════

structural_rules:

  - id: rule.dimensional_consistency
    relation: >
      Two quantities can appear in an equation, sum, or difference iff their
      dimension vectors are equal. dim(A·B) = dim(A) + dim(B).
      dim(A/B) = dim(A) - dim(B).
    quantities: []
    scope: []
    provenance: "BIPM SI Brochure 9th ed."
    hardness: structural
    layer: rule

  - id: rule.conservation_continuity
    relation: >
      Every conserved quantity has a local continuity equation: ∂_μ J^μ = 0.
      Follows from T + Noether theorem [L, E1].
    quantities:
      - qty.energy
      - qty.momentum
      - qty.electric_charge
    scope: []
    provenance: "Noether (1918); T projection 1"
    hardness: structural
    layer: rule

  - id: rule.empirical_verification_boundary
    relation: >
      A theory not confirmed by experiment cannot serve as adjudicating
      criteria for kernel placement or override empirically established,
      non-inferable kernel premises.
    quantities: []
    scope: []
    provenance: "Sci-hf kernel construction principle"
    hardness: structural
    layer: rule